[project]
name = "jobradar"
version = "0.1.0"
description = "Aggregates job postings from public APIs and job boards, ranks them, publishes a static index."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
# Tier 2 scraping. Kept optional so the Tier 1 pipeline installs fast and never
# breaks when Scrapling's browser deps are unavailable (see sources/stealth.py).
scrape = [
    "scrapling[fetchers]>=0.2.9",
]
career = [
    "pypdf>=4.2",  # only needed to read a PDF CV
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
jobradar = "jobradar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobradar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/Argument() in a default is the library's documented idiom, not the bug
# B008 targets.
"jobradar/cli.py" = ["B008"]
"jobradar/career/cli.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
