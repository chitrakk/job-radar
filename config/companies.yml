# Company ATS board tokens, polled every run.
#
# Every token in this file was verified live against its endpoint — run
# `uv run python scripts/verify_boards.py` to re-check and see which have gone dead.
# Board tokens rot as companies switch ATS, so expect to prune this occasionally.
#
# To add a company: open its careers page and read the token out of the URL its job list
# loads from — boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>,
# apply.workable.com/<token>, jobs.smartrecruiters.com/<token>, <token>.recruitee.com.
#
# A note on India coverage, established by probing ~150 candidate tokens: Indian-domestic
# employers mostly do NOT use these ATS platforms (they run Darwinbox, Keka, Workday,
# SuccessFactors or Naukri's own RMS, none of which expose a public job API). What this
# list does give you is (a) global companies that hire heavily into Bengaluru/Hyderabad/
# Pune/Gurugram, and (b) India-founded product companies that sell globally. For
# India-domestic listings the load-bearing sources are Adzuna and LinkedIn, not this file.

