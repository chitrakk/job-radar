name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Node is needed by test_shared_parity.py, which proves the shared slop patterns
      # behave identically in Python and in the browser.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,career]"
          uv run ruff check .
          # No live network in CI — every source test runs against recorded payloads.
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          # The city and role filters decide what the whole site shows, and a wrong answer
          # there looks exactly like a right one. Run them before the build.
          npm test
          npm run build
